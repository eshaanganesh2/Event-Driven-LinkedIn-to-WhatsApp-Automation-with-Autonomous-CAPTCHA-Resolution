name: Build and Deploy

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Safely Print OIDC 'sub' Claim Only
        run: |
          # Fetch token
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          
          # Extract only the 'sub' claim to avoid printing entire raw signatures/tokens
          SUB_CLAIM=$(echo "$TOKEN" | jq -R 'split(".") | .[1] | @base64d | fromjson | .sub')
          
          echo "Current OIDC Sub Claim: $SUB_CLAIM"

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up AWS SAM
        uses: aws-actions/setup-sam@v2

      - name: Validate SAM template
        run: |
          sam validate --lint

      - name: Build SAM application
        run: |
          sam build --use-container --no-cached

      - name: Deploy to AWS
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              ScheduleExpression="${{ vars.SCHEDULE_EXPRESSION }}"
